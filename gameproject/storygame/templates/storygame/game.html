<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ストーリーゲーム</title>

    <style>
        body{
            background:#222;
            color:white;
            text-align:center;
            font-family:sans-serif;
            padding-top:50px;
        }

        .box{
            width:60%;
            margin:auto;
            background:#333;
            padding:30px;
            border-radius:10px;
        }

        button{
            margin:10px;
            padding:10px 20px;
            font-size:18px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>{{ scene.title }}</h1>

    <p>{{ scene.text }}</p>

    {% if scene.choices.all %}

    {% for choice in scene.choices.all %}
        <a href="/story/scene/{{ choice.next_scene.id }}/">
            <button>
                {{ choice.text }}
            </button>
        </a>
    {% endfor %}

{% else %}

    <h2>GAME CLEAR!</h2>

    <a href="/story/">
        <button>
            最初に戻る
        </button>
    </a>

{% endif %}

</div>

</body>
</html>
