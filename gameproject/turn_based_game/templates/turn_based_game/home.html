{% load static %}

<!DOCTYPE html>
<html lang="ja">

<style>

@keyframes floatCharacter {
    0% {
        transform: translateX(-50%) translateY(0px);
    }

    50% {
        transform: translateX(-50%) translateY(-10px);
    }

    100% {
        transform: translateX(-50%) translateY(0px);
    }
}

@keyframes eatCharacter {

    0% {
        transform: translateX(-50%) scaleY(1);
    }

    25% {
        transform: translateX(-50%) scaleY(0.9);
    }

    50% {
        transform: translateX(-50%) scaleY(1);
    }

    75% {
        transform: translateX(-50%) scaleY(0.9);
    }

    100% {
        transform: translateX(-50%) scaleY(1);
    }
}

@keyframes foodAppear {

    0% {
        opacity: 0;
        transform: translateY(20px);
    }

    20% {
        opacity: 1;
        transform: translateY(0px);
    }

    80% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translateY(-20px);
    }
}

.parameter-box {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

</style>

<head>
    <meta charset="UTF-8">
    <title>ターン制育成ゲーム</title>
</head>

<body>

    <h1>ターン制育成ゲーム</h1>

    <div style="
        display: flex;
        align-items: flex-start;
        gap: 30px;
    ">

        <!-- 背景＋キャラクター -->
        <div style="
            width: 600px;
            height: 400px;
            background-image: url('/static/{{ background_image }}');
            background-size: cover;
            background-position: center;
            position: relative;
            border: 2px solid #ccc;
            border-radius: 10px;
        ">

            <!-- キャラクター -->
            <img src="/static/{{ character_image }}"
                 width="250"
                 style="
                    position: absolute;
                    bottom: 20px;
                    left: 50%;
                    transform: translateX(-50%);
                    animation: floatCharacter 2s ease-in-out infinite;
                 ">

            <!-- ごはん -->
            {% if show_food %}
            <img src="/static/images/food.png"
                 width="100"
                 style="
                    position: absolute;
                    bottom: 180px;
                    left: 55%;
                    transform: translateX(-50%);
                    animation: foodAppear 1.5s ease-out;
                 ">
            {% endif %}

            <!-- ボール -->
            {% if show_ball %}
            <img src="/static/images/ball.png"
                 width="90"
                 style="
                    position: absolute;
                    bottom: 170px;
                    left: 58%;
                    transform: translateX(-50%);
                    animation: foodAppear 1.5s ease-out;
                 ">
            {% endif %}

            <!-- Zzz -->
            {% if show_sleep %}
            <img src="/static/images/zzz.png"
                 width="80"
                 style="
                    position: absolute;
                    bottom: 250px;
                    left: 58%;
                    transform: translateX(-50%);
                    animation: foodAppear 2s ease-out;
                 ">
            {% endif %}

        </div>

        <!-- パラメータ -->
        <div style="
            min-width: 200px;
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            background-color: #f8f8f8;
        ">

            <h2>パラメータ</h2>

            <p>満足度：{{ satisfaction }}</p>
            <p>元気：{{ energy }}</p>
            <p>成長度：{{ growth }}</p>
            <p>満腹度：{{ fullness }}</p>
            <p>ターン：{{ turn }}</p>

        </div>

    </div>

    <!-- 行動 -->
    <h2>行動</h2>

    <form method="GET">

        <button type="submit"
                name="action"
                value="food"
                {% if game_end %}disabled{% endif %}>
            ごはん
        </button>

        <button type="submit"
                name="action"
                value="play"
                {% if game_end %}disabled{% endif %}>
            あそぶ
        </button>

        <button type="submit"
                name="action"
                value="rest"
                {% if game_end %}disabled{% endif %}>
            休む
        </button>

    </form>

    <!-- イベント -->
    <h2>イベント</h2>
    <p>{{ event_message }}</p>

    <!-- ゲーム状態 -->
    <h2>ゲーム状態</h2>
    <p>{{ game_status }}</p>

    <!-- リセット -->
    <form method="GET">
        <button type="submit"
                name="action"
                value="reset">
            リセット
        </button>
    </form>

</body>
</html>
