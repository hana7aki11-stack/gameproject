{% load static %}
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>{% block page_title %}ミニゲーム{% endblock %}</title>

<style>

body{
    margin:0;
    background-image:url("{% static background_image %}");
    background-size:cover;
    background-position:center;
    font-family:sans-serif;
}

.game-container{
    width:900px;
    height:700px;
    margin:30px auto;
    background:rgba(255,255,255,0.6);
    border-radius:20px;
    text-align:center;
}

.status-bar{
    display:flex;
    justify-content:space-around;
    font-size:24px;
    margin-top:20px;
}

.game-area{
    width:800px;
    height:350px;
    margin:20px auto;
    border:3px solid #444;
    background:rgba(255,255,255,0.4);
    position:relative;
    overflow:hidden;
}

.character-area{
    margin-top:20px;
}

.character-area img{
    height:180px;
}

.button-area{
    margin-top:20px;
}

.button-area a{
    font-size:24px;
    text-decoration:none;
    padding:10px 30px;
    border-radius:10px;
    background:#6fa8dc;
    color:white;
}

#game-over{
    display:none;
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    color:white;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-size:30px;
    text-align:center;
    z-index:50;
}

{% block extra_style %}{% endblock %}

</style>

</head>

<body>

<div class="game-container">

    <h1>{{ game_title }}</h1>

    <div class="status-bar">

        <div>スコア：<span id="score">0</span></div>

        <div>残り時間：<span id="time"></span>秒</div>

        {% block status_extra %}{% endblock %}

    </div>

    <div class="game-area" id="game-area">

        {% block game_area %}{% endblock %}

        <!-- ゲーム終了画面 -->
        <div id="game-over">

    <h2>ゲーム終了！</h2>

    <p>{% block result_label %}スコア{% endblock %}：<span id="final-score"></span></p>

    <p>ホーム画面へ戻ります…</p>

</div>

    </div>

    <div class="character-area">

        <img src="{% static character_image %}" id="character">

    </div>

    <div class="button-area">

        <a href="{% url 'home' %}">戻る</a>

    </div>

</div>

{% block config %}{% endblock %}

<script>
{% block script %}{% endblock %}
</script>

</body>

</html>
