{% load static %}
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>ボールキャッチ</title>

<style>

body{
    margin:0;
    background-image:url("{% static background_image %}");
    background-size:cover;
    background-position:center;
    font-family:sans-serif;
}

.game-container{
    width:900px;
    height:700px;
    margin:30px auto;
    background:rgba(255,255,255,0.6);
    border-radius:20px;
    text-align:center;
}

.difficulty-bar{
    display:flex;
    justify-content:center;
    gap:10px;
    padding-top:15px;
}

.difficulty-button{
    font-size:16px;
    font-weight:bold;
    padding:8px 18px;
    border-radius:10px;
    text-decoration:none;
    color:white;
    background:#999;
}

.difficulty-button.easy{ background:#8bc34a; }
.difficulty-button.normal{ background:#42a5f5; }
.difficulty-button.hard{ background:#ff9800; }
.difficulty-button.oni{ background:#e53935; }

.difficulty-button.active{
    outline:3px solid #333;
}

.difficulty-button.locked{
    background:#bbb;
    color:#777;
    cursor:not-allowed;
}

.status-bar{
    display:flex;
    justify-content:space-around;
    font-size:24px;
    margin-top:10px;
}

.game-area{
    width:800px;
    height:350px;
    margin:20px auto;
    border:3px solid #444;
    background:rgba(255,255,255,0.4);
    position:relative;
}

.character-area{
    margin-top:20px;
}

.character-area img{
    height:180px;
}

.game-object{
    width:70px;
    position:absolute;
    cursor:pointer;
    transition: width 0.2s, height 0.2s;
}

.button-area{
    margin-top:20px;
}

.button-area a{
    font-size:24px;
    text-decoration:none;
    padding:10px 30px;
    border-radius:10px;
    background:#6fa8dc;
    color:white;
}


#game-over{
    display:none;
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    color:white;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-size:30px;
    text-align:center;
}

</style>

</head>

<body>

<div class="game-container">

    <h1>{{ game_title }}</h1>

    <!-- 難易度選択 -->
    <div class="difficulty-bar">

        {% for level in difficulty_list %}

            {% if level.unlocked %}
                <a href="?difficulty={{ level.key }}"
                   class="difficulty-button {{ level.key }} {% if level.key == selected_difficulty %}active{% endif %}">
                    {{ level.label }}
                </a>
            {% else %}
                <span class="difficulty-button locked">
                     {{ level.label }}
                </span>
            {% endif %}

        {% endfor %}

    </div>

    <div class="status-bar">

        <div>スコア：<span id="score">0</span></div>

        <div>残り時間：<span id="time"></span>秒</div>

    </div>

    <div class="game-area">

    <img
        src="{% static ball_image %}"
        id="ball"
        class="game-object"
    >

    <!-- ゲーム終了画面 -->
    <div id="game-over">

        <h2>ゲーム終了！</h2>

        <p>スコア：<span id="final-score"></span></p>

        <p>5秒後にホーム画面へ戻ります…</p>

    </div>

</div>
    <div class="character-area">

        <img src="{% static character_image %}" id="character">

    </div>

    <div class="button-area">

        <a href="{% url 'home' %}">戻る</a>

    </div>

</div>

<!-- 難易度設定値（Djangoから渡された値） -->
<div id="game-config"
     data-difficulty="{{ selected_difficulty }}"
     data-ball-speed="{{ ball_speed }}"
     data-spawn-interval="{{ spawn_interval }}"
     data-score-multiplier="{{ score_multiplier }}"
     style="display:none;">
</div>

<script>

// -------------------------
// 難易度設定を取得
// -------------------------

const config = document.getElementById("game-config");

const difficulty = config.dataset.difficulty;
const ballSpeed = parseFloat(config.dataset.ballSpeed);       // 1.0〜2.4
const spawnInterval = parseInt(config.dataset.spawnInterval); // 1000〜400ms
const scoreMultiplier = parseFloat(config.dataset.scoreMultiplier);

// 難易度に応じた制限時間（難しいほど短い）
const TIME_LIMIT_MAP = {
    easy: 20,
    normal: 18,
    hard: 15,
    oni: 12,
};

// 難易度に応じたボールサイズ（難しいほど小さい）
const BALL_SIZE_MAP = {
    easy: 70,
    normal: 60,
    hard: 50,
    oni: 38,
};


// -------------------------
// キャラクター画像を取得
// -------------------------

const character = document.getElementById("character");

const normalImage = "{% static character_image %}";
const happyImage = "{% static character_happy_image %}";


// -------------------------
// ボール・ゲームエリアを取得
// -------------------------

const ball = document.getElementById("ball");
const area = document.querySelector(".game-area");

// 難易度に応じてボールサイズを反映
const ballSize = BALL_SIZE_MAP[difficulty] || 70;
ball.style.width = ballSize + "px";


// -------------------------
// スコアの設定
// -------------------------

let score = 0;
const scoreDisplay = document.getElementById("score");


// -------------------------
// タイマーの設定
// -------------------------

let time = TIME_LIMIT_MAP[difficulty] || 20;
const timeDisplay = document.getElementById("time");
timeDisplay.textContent = time;


// -------------------------
// ボールをランダムな位置へ移動
// -------------------------

function moveBall(){

    const maxX = area.clientWidth - ball.offsetWidth;
    const maxY = area.clientHeight - ball.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    ball.style.left = x + "px";
    ball.style.top = y + "px";

}

// ゲーム開始時にボールを配置
moveBall();


// -------------------------
// 自動移動タイマー（難易度が高いほど速い）
// クリックしなくても一定間隔でボールが逃げる
// -------------------------

let autoMoveTimer = setInterval(function () {

    moveBall();

}, spawnInterval);


// -------------------------
// タイマー開始
// -------------------------

startTimer();


// -------------------------
// スコアを増やす（難易度倍率を反映）
// -------------------------

function addScore() {

    score += scoreMultiplier;

    // 表示は整数で見せる
    scoreDisplay.textContent = Math.round(score);

}


// -------------------------
// キャラクターをHappyにする
// -------------------------

function happyCharacter() {

    character.src = happyImage;

    setTimeout(function () {

        character.src = normalImage;

    }, 500);

}


// -------------------------
// タイマー処理
// -------------------------

function startTimer() {

    const timer = setInterval(function () {

        time--;
        timeDisplay.textContent = time;

        if (time <= 0) {

            clearInterval(timer);
            clearInterval(autoMoveTimer);

            ball.style.display = "none";

            document.getElementById("game-over").style.display = "flex";
            document.getElementById("final-score").textContent = Math.round(score);

            setTimeout(function () {

                window.location.href =
                    "{% url 'home' %}?action=ball_game&score=" + Math.round(score) +
                    "&difficulty=" + difficulty;

            }, 5000);

        }

    }, 1000);

}


// -------------------------
// ボールをクリックした時の処理
// -------------------------

ball.addEventListener("click", function () {

    addScore();
    happyCharacter();

    setTimeout(function () {

        moveBall();

    }, 150 / ballSpeed); // 難易度が高いほど早く再配置

});

</script>

</body>

</html>
